[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erebus-sdk"
version = "0.1.0"
description = "Signed execution receipts for Python agents — no erebus build required"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["erebus"]
