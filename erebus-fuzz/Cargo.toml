[package]
name = "erebus-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
erebus-core = { path = "../erebus-core" }
erebus-stub = { path = "../erebus-stub" }
erebus-cli = { path = "../erebus-cli" }
arbitrary = { version = "1.3", features = ["derive"] }
proptest = "1.0"
rand = "0.8"
rand_chacha = "0.3"
tempfile = "3.8"
anyhow = "1.0"
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
bincode = "1.3"
tokio = { version = "1.0", features = ["rt-multi-thread", "time", "fs", "macros"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"