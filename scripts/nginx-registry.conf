# erebus registry nginx reverse-proxy template
# Usage: copy to /etc/nginx/sites-available/erebus-registry, adjust domain,
# then symlink to sites-enabled and reload nginx.
#
# Prerequisites:
#   - TLS cert (letsencrypt/certbot or your CA)
#   - registry_server.py listening on 127.0.0.1:8080 (see registry.service)

upstream erebus_registry {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name registry.erebus.io;  # <-- change to your domain

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS frontend
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name registry.erebus.io;  # <-- change to your domain

    # TLS — replace with your cert paths
    ssl_certificate     /etc/letsencrypt/live/registry.erebus.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registry.erebus.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # HSTS (optional, adjust max-age to taste)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 1g;
    client_body_timeout 300s;

    # Proxy all traffic to the stdlib server
    location / {
        proxy_pass http://erebus_registry;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts: SISR pulls of large models can take minutes
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering       off;

        # Health checks must not be cached
        location = /health {
            proxy_pass http://erebus_registry;
            add_header Cache-Control "no-store" always;
        }
    }

    # Static landing assets could be served directly from nginx in the future
    # (currently rendered by the Python server)
}
