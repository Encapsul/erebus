name: Release

# Glow-style release pipeline.
#
# On every `v*` tag push, build one archive per platform, produce
# checksums.txt, then create the GitHub release with all assets.
#
#   erebus_<version>_<os>_<arch>.<ext>
#   erebus_0.5.0_linux_amd64.tar.gz     (erebus + erebus-stub + erebus-crypto)
#   erebus_0.5.0_linux_arm64.tar.gz     (erebus + erebus-stub + erebus-crypto)
#   erebus_0.5.0_darwin_amd64.tar.gz    (erebus + erebus-stub + erebus-crypto)
#   erebus_0.5.0_darwin_arm64.tar.gz    (erebus + erebus-stub + erebus-crypto)
#   erebus_0.5.0_windows_amd64.tar.gz   (erebus + erebus-stub + erebus-crypto)
#   erebus_0.5.0_<os>_<arch>.tar.gz.sha256   (one sidecar per archive, for `erebus upgrade`)
#   checksums.txt
#
# Consumers of this naming: scripts/install.sh and erebus-cli/src/commands/upgrade.rs.
#
# Strategy:
#   - All targets cross-compiled from ubuntu with cargo-zigbuild (zig C
#     cross-compiler). Windows via zig's mingw; macOS via zig + a downloaded
#     macOS SDK (SDKROOT) for the Apple frameworks pulled in by ring/sysinfo.
#   - Linux: musl/gnu matrix. amd64 + arm64 musl are the release-critical
#     pair; the other architectures are marked `experimental` so a failure
#     never blocks the release (fail-open expansion, not a gate). The stub
#     (seccomp/landlock) builds only on x86_64/aarch64/i686/armv7/arm — other
#     targets are CLI-only (see ROADMAP.md).
#   - macOS amd64/arm64: CLI + stub (stub has a macos_sandbox Seatbelt port).
#   - Windows amd64: CLI + stub (stub has a win.rs FFI layer).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  EREBUS_NODE_VERSION: "20.18.0"

jobs:
  # ── Linux (all targets, cross-compiled with zigbuild) ───────────────
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    # Must always evaluate to a boolean: with `${{ matrix.experimental }}`
    # the legs without the key resolved to null and GitHub silently dropped
    # the whole job (no linux archives, publish skipped) since v0.5.0.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # stub builds only where the seccomp/landlock constants exist:
          # x86_64, aarch64, i686, armv7, arm. Everything else is CLI-only.
          - { target: x86_64-unknown-linux-musl, arch: amd64, stub: true, experimental: false }
          - { target: aarch64-unknown-linux-musl, arch: arm64, stub: true, experimental: false }
          - { target: i686-unknown-linux-musl, arch: i386, stub: true, experimental: true }
          - { target: armv7-unknown-linux-musleabihf, arch: armv7, stub: true, experimental: true }
          - { target: arm-unknown-linux-musleabihf, arch: arm, stub: true, experimental: true }
          - { target: riscv64gc-unknown-linux-musl, arch: riscv64, stub: false, experimental: true }
          - { target: powerpc64le-unknown-linux-musl, arch: ppc64le, stub: false, experimental: true }
          - { target: x86_64-unknown-linux-gnu, arch: amd64-gnu, stub: false, experimental: true }
          - { target: aarch64-unknown-linux-gnu, arch: arm64-gnu, stub: false, experimental: true }
          - { target: i686-unknown-linux-gnu, arch: i386-gnu, stub: false, experimental: true }
          - { target: armv7-unknown-linux-gnueabihf, arch: armv7-gnu, stub: false, experimental: true }
          - { target: riscv64gc-unknown-linux-gnu, arch: riscv64-gnu, stub: false, experimental: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (2026-08-26)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install zig (musl cross C compiler)
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build stub (Linux only — uses /proc/self/exe, namespaces, seccomp)
        if: matrix.stub
        run: cargo zigbuild --release --target ${{ matrix.target }} -p erebus-stub

      - name: Build CLI
        run: cargo zigbuild --release --target ${{ matrix.target }} -p erebus-cli

      - name: Package
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME#v}"
          T="${{ matrix.target }}"
          D="erebus_${V}_linux_${{ matrix.arch }}"
          mkdir -p "${D}"
          cp "target/${T}/release/erebus" "${D}/erebus"
          if [ -f "target/${T}/release/erebus-stub" ]; then
            cp "target/${T}/release/erebus-stub" "${D}/erebus-stub"
          fi
          if [ -f "target/${T}/release/erebus-crypto" ]; then
            cp "target/${T}/release/erebus-crypto" "${D}/erebus-crypto"
          fi
          find "${D}" -type f -exec chmod +x {} +
          tar -czf "${D}.tar.gz" "${D}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: erebus_*.tar.gz
          if-no-files-found: error

  # ── Darwin amd64 (macOS Intel) ──────────────────────────────────────
  # Cross-compiled on ubuntu via cargo-zigbuild + downloaded macOS SDK.
  # (Native macOS runners were flaky: macos-13 retired Dec 2025, and the
  # jobs failed from day one. The ubuntu zigbuild path is verified green.)
  darwin-amd64:
    name: darwin amd64
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: /tmp/erebus-stub-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (2026-08-26)
        with:
          toolchain: stable
          targets: x86_64-apple-darwin
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Download macOS SDK
        run: |
          mkdir -p /tmp/macos-sdk
          curl -sL -o /tmp/macos-sdk/sdk.tar.xz \
            https://github.com/roblabla/MacOSX-SDKs/releases/download/13.1/MacOSX13.1.sdk.tar.xz
          tar xf /tmp/macos-sdk/sdk.tar.xz -C /tmp/macos-sdk
          echo "SDKROOT=/tmp/macos-sdk/MacOSX13.1.sdk" >> "$GITHUB_ENV"

      - name: Build stub
        run: cargo zigbuild --release -p erebus-stub --target x86_64-apple-darwin

      - name: Build CLI
        run: cargo zigbuild --release -p erebus-cli --target x86_64-apple-darwin

      - name: Verify
        run: |
          file /tmp/erebus-stub-target/x86_64-apple-darwin/release/erebus | grep -q "Mach-O"
          file /tmp/erebus-stub-target/x86_64-apple-darwin/release/erebus-stub | grep -q "Mach-O"

      - name: Package
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME#v}"
          D="erebus_${V}_darwin_amd64"
          mkdir -p "${D}"
          cp /tmp/erebus-stub-target/x86_64-apple-darwin/release/erebus "${D}/erebus"
          cp /tmp/erebus-stub-target/x86_64-apple-darwin/release/erebus-stub "${D}/erebus-stub"
          cp /tmp/erebus-stub-target/x86_64-apple-darwin/release/erebus-crypto "${D}/erebus-crypto"
          chmod +x "${D}/erebus" "${D}/erebus-stub" "${D}/erebus-crypto"
          tar -czf "${D}.tar.gz" "${D}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-amd64
          path: erebus_*.tar.gz

  # ── Darwin arm64 (macOS Apple Silicon) ──────────────────────────────
  darwin-arm64:
    name: darwin arm64
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: /tmp/erebus-stub-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (2026-08-26)
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Download macOS SDK
        run: |
          mkdir -p /tmp/macos-sdk
          curl -sL -o /tmp/macos-sdk/sdk.tar.xz \
            https://github.com/roblabla/MacOSX-SDKs/releases/download/13.1/MacOSX13.1.sdk.tar.xz
          tar xf /tmp/macos-sdk/sdk.tar.xz -C /tmp/macos-sdk
          echo "SDKROOT=/tmp/macos-sdk/MacOSX13.1.sdk" >> "$GITHUB_ENV"

      - name: Build stub
        run: cargo zigbuild --release -p erebus-stub --target aarch64-apple-darwin

      - name: Build CLI
        run: cargo zigbuild --release -p erebus-cli --target aarch64-apple-darwin

      - name: Verify
        run: |
          file /tmp/erebus-stub-target/aarch64-apple-darwin/release/erebus | grep -q "Mach-O"
          file /tmp/erebus-stub-target/aarch64-apple-darwin/release/erebus | grep -q "arm64"
          file /tmp/erebus-stub-target/aarch64-apple-darwin/release/erebus-stub | grep -q "Mach-O"
          file /tmp/erebus-stub-target/aarch64-apple-darwin/release/erebus-stub | grep -q "arm64"

      - name: Package
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME#v}"
          D="erebus_${V}_darwin_arm64"
          mkdir -p "${D}"
          cp /tmp/erebus-stub-target/aarch64-apple-darwin/release/erebus "${D}/erebus"
          cp /tmp/erebus-stub-target/aarch64-apple-darwin/release/erebus-stub "${D}/erebus-stub"
          cp /tmp/erebus-stub-target/aarch64-apple-darwin/release/erebus-crypto "${D}/erebus-crypto"
          chmod +x "${D}/erebus" "${D}/erebus-stub" "${D}/erebus-crypto"
          tar -czf "${D}.tar.gz" "${D}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-arm64
          path: erebus_*.tar.gz

  # ── Windows amd64 ───────────────────────────────────────────────────
  # Cross-compiled on ubuntu via cargo-zigbuild (zig provides the mingw C
  # toolchain; no mingw-w64 install needed). Verified green — erebus-core and
  # erebus-cli are Windows-portable and the stub has a win.rs FFI layer.
  windows-amd64:
    name: windows amd64
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: /tmp/erebus-stub-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (2026-08-26)
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build stub
        run: cargo zigbuild --release -p erebus-stub --target x86_64-pc-windows-gnu

      - name: Build CLI
        run: cargo zigbuild --release -p erebus-cli --target x86_64-pc-windows-gnu

      - name: Verify
        run: |
          file /tmp/erebus-stub-target/x86_64-pc-windows-gnu/release/erebus.exe | grep -q "PE32+"
          file /tmp/erebus-stub-target/x86_64-pc-windows-gnu/release/erebus-stub.exe | grep -q "PE32+"

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          V="${GITHUB_REF_NAME#v}"
          D="erebus_${V}_windows_amd64"
          mkdir -p "${D}"
          cp /tmp/erebus-stub-target/x86_64-pc-windows-gnu/release/erebus.exe "${D}/erebus.exe"
          cp /tmp/erebus-stub-target/x86_64-pc-windows-gnu/release/erebus-stub.exe "${D}/erebus-stub.exe"
          cp /tmp/erebus-stub-target/x86_64-pc-windows-gnu/release/erebus-crypto.exe "${D}/erebus-crypto.exe"
          tar -czf "${D}.tar.gz" "${D}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-amd64
          path: erebus_*.tar.gz

  # ── Publish the release with all assets + checksums ─────────────────
  publish:
    name: Publish GitHub release
    needs: [linux, darwin-amd64, darwin-arm64, windows-amd64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      # checksums.txt for humans and install.sh; one <archive>.sha256 sidecar
      # per archive for `erebus upgrade` (fetches the digest before the
      # download and fails closed).
      - name: Generate checksums
        run: |
          cd dist
          sha256sum erebus_*.tar.gz > checksums.txt
          for f in erebus_*.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          cat checksums.txt

      - name: List artifacts
        run: ls -lh dist/

      # Release notes = the changelog section of this version (first `## `
      # block whose heading contains the version), else the top section.
      - name: Release notes
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '
            /^## / { if (found) exit; if (index($0, v)) { found = 1 } ; if (found) next }
            found { print }
          ' docs/src/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            awk 'BEGIN{n=0} /^## /{n++; if (n==2) exit; next} n==1{print}' docs/src/CHANGELOG.md > notes.md
          fi
          printf '\n---\nInstall: `curl -fsSL https://raw.githubusercontent.com/%s/main/scripts/install.sh | bash`\n' \
            "$GITHUB_REPOSITORY" >> notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "erebus $GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              dist/erebus_*.tar.gz dist/erebus_*.tar.gz.sha256 dist/checksums.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "erebus $GITHUB_REF_NAME" \
              --notes-file notes.md \
              dist/erebus_*.tar.gz dist/erebus_*.tar.gz.sha256 dist/checksums.txt
          fi

  # ── QEMU boot test for linux-aarch64 ─────────────────────────────────
  qemu-aarch64:
    name: QEMU aarch64 boot test
    runs-on: ubuntu-24.04
    needs: [linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (2026-08-26)
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Build aarch64 stub + CLI
        run: |
          cargo zigbuild --release --target aarch64-unknown-linux-musl -p erebus-stub
          cargo zigbuild --release --target aarch64-unknown-linux-musl -p erebus-cli
      # qemu-user cannot enter a user namespace (`unshare(CLONE_NEWUSER)` →
      # EINVAL) and the stub fails closed on that, by design. This job checks
      # that the aarch64 stub boots and execs the app under emulation, so the
      # bundle is built with `--isolation none`; the sandbox itself is
      # exercised natively by ci.yml / proof.yml.
      - name: Build hello-web for aarch64
        env:
          ERE_STUB_PATH: target/aarch64-unknown-linux-musl/release/erebus-stub
        run: |
          ./target/aarch64-unknown-linux-musl/release/erebus build examples/hello-web \
            --target aarch64 --isolation none -o /tmp/hello-web-aarch64.erebus
      - name: Run under QEMU
        timeout-minutes: 10
        run: |
          ERE_VERBOSE=1 qemu-aarch64-static -L /usr/aarch64-linux-gnu /tmp/hello-web-aarch64.erebus \
            >/tmp/qemu-boot.log 2>&1 &
          PID=$!
          ok=0
          # cold start = extract + python under emulation; allow up to 90 s
          for _ in $(seq 1 45); do
            sleep 2
            if curl -s -m 2 http://127.0.0.1:8080 | grep -q "Hello"; then ok=1; break; fi
            kill -0 "$PID" 2>/dev/null || break
          done
          kill "$PID" 2>/dev/null || true
          echo "--- stub output ---"; cat /tmp/qemu-boot.log
          if [ "$ok" = 1 ]; then echo "QEMU boot test passed"; else echo "QEMU boot test failed"; exit 1; fi
