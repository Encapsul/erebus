apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "erebus-registry.fullname" . }}
  labels:
    {{- include "erebus-registry.labels" . | nindent 4 }}
data:
  # Non-secret registry flags. SSO credentials and Stripe keys belong in the
  # Secret (templates/secret.yaml), not here.
  REGISTRY_DIR: {{ .Values.registry.dir | quote }}
  REGISTRY_QUOTA_GB: {{ .Values.registry.quotaGb | quote }}
  REGISTRY_UPLOAD_CAP_GB: {{ .Values.registry.uploadCapGb | quote }}
  REGISTRY_REQUIRE_AUTH: {{ .Values.registry.requireAuth | quote }}
  REGISTRY_ALLOW_ANON_UPLOADS: {{ .Values.registry.allowAnonUploads | quote }}
