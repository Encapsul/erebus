apiVersion: v1
kind: Secret
metadata:
  name: {{ include "erebus-registry.fullname" . }}
  labels:
    {{- include "erebus-registry.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Only populated when SSO is enabled. Never hardcode a real secret here or in
  # values.yaml — provide it at install time, e.g.:
  #   helm install ... --set sso.enabled=true --set sso.clientId=X --set sso.clientSecret='<redacted>'
  {{- if .Values.sso.enabled }}
  sso-client-secret: {{ .Values.sso.clientSecret | quote }}
  {{- end }}
