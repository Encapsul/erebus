apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "erebus-registry.fullname" . }}
  labels:
    {{- include "erebus-registry.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "erebus-registry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "erebus-registry.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "erebus-registry.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: registry
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python3
            - /app/registry_server.py
          args:
            - --dir
            - {{ .Values.registry.dir | quote }}
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --quota-gb
            - {{ .Values.registry.quotaGb | quote }}
            - --upload-cap-gb
            - {{ .Values.registry.uploadCapGb | quote }}
            {{- if .Values.registry.requireAuth }}
            - --require-auth
            {{- end }}
            {{- if .Values.registry.allowAnonUploads }}
            - --allow-anon-uploads
            {{- end }}
            {{- if .Values.sso.enabled }}
            - --sso-issuer
            - {{ .Values.sso.issuer | quote }}
            - --sso-client-id
            - {{ .Values.sso.clientId | quote }}
            - --sso-client-secret
            - {{ .Values.sso.clientSecret | quote }}
            - --base-url
            - {{ .Values.sso.baseUrl | quote }}
            {{- if .Values.sso.provider }}
            - --sso-provider
            - {{ .Values.sso.provider | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.registry.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.registry.dir | quote }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "erebus-registry.fullname" . }}
        {{- else }}
          emptyDir: {}
        {{- end }}
